<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>독살</title>
<style>html,body{margin:0;height:100%;background:#132430;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}canvas{display:block;touch-action:none}
#back{position:fixed;left:10px;top:8px;font:600 13px system-ui,'Malgun Gothic',sans-serif;color:#9DB4B6;text-decoration:none;z-index:2}#out{display:none}</style>
</head><body><a id="back" href="./">← 실험실</a><canvas id="c"></canvas><pre id="out"></pre>
<script>
'use strict';
window.onerror = (m, s, l, c) => { const o = document.getElementById('out'); if (o) o.textContent = 'ERR ' + m + ' @' + l + ':' + c; };
// ── 공통 뼈대: 화면 맞춤 · 입력 · 소리 · 진동 · UI 조각 · 봇/검증 훅 ──
const W = 800, H = 800;
const QS = new URLSearchParams(location.search);
const BOT = +(QS.get('bot') || 0);            // 1 = 잘하는 봇, 2 = 서툰 봇 (검증용)
const FAST = Math.max(1, +(QS.get('fast') || 1));
let seed = +(QS.get('seed') || (Date.now() % 1e9));
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const R = (a, b) => a + (b - a) * rnd();
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const C = { bg: '#132430', bg2: '#1B3442', cream: '#FFF3DC', gold: '#F7B94E', red: '#E5533D', teal: '#3FA7A0', green: '#7BC96F', wood: '#C98B4F', wood2: '#A86F3B', ink: '#0B1820', dim: '#9DB4B6' };

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let DPR = 1, SC = 1;
function fit() {
  DPR = Math.min(2, devicePixelRatio || 1);
  const de = document.documentElement, s = Math.floor(Math.min(innerWidth || de.clientWidth, innerHeight || de.clientHeight)) || 800;
  SC = s / W; cv.style.width = s + 'px'; cv.style.height = s + 'px';
  cv.width = Math.round(s * DPR); cv.height = Math.round(s * DPR);
}
addEventListener('resize', fit); addEventListener('load', fit); fit();
let lastFit = '';
function refit() { const k = innerWidth + 'x' + innerHeight; if (k !== lastFit) { lastFit = k; fit(); } }

// ── 입력 ──
const P = { x: W / 2, y: H / 2, down: false, id: null };
let btns = [];
function toL(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
cv.addEventListener('pointerdown', e => {
  ac(); e.preventDefault();
  const [x, y] = toL(e);
  for (const b of btns) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { G.onButton && G.onButton(b.id); return; }
  if (BOT) return;
  if (P.down) return;               // 두 번째 손가락은 버튼만
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  P.x = x; P.y = y; P.down = true; P.id = e.pointerId;
  G.onDown && G.onDown(x, y);
});
cv.addEventListener('pointermove', e => {
  if (BOT || e.pointerId !== P.id) return;
  const [x, y] = toL(e); P.x = x; P.y = y; G.onMove && G.onMove(x, y);
});
function up(e) { if (BOT || e.pointerId !== P.id) return; P.down = false; P.id = null; G.onUp && G.onUp(); }
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
addEventListener('keydown', e => { ac(); G.onKey && G.onKey(e.code); });

// ── 소리 (WebAudio 합성, 외부 파일 없음) ──
let AC = null, MASTER = null, NB = null;
function ac() {
  if (BOT) return null;
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); MASTER = AC.createGain(); MASTER.gain.value = 0.55; MASTER.connect(AC.destination); } catch (_) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
const live = () => AC && AC.state === 'running';
function tone(f, d = 0.1, type = 'sine', g = 0.2, f2 = 0) {
  if (!live()) return;
  const t = AC.currentTime, o = AC.createOscillator(), v = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(v); v.connect(MASTER); o.start(t); o.stop(t + d + 0.02);
}
function nbuf() { if (!NB) { NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } return NB; }
function noise(d = 0.1, g = 0.2, freq = 1200, q = 1, type = 'bandpass') {
  if (!live()) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), v = AC.createGain();
  s.buffer = nbuf(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(0.001, t + d);
  s.connect(f); f.connect(v); v.connect(MASTER); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.02);
}
function loopNoise(freq = 900, q = 0.8) {   // 문지르기처럼 계속 나는 소리
  let s = null, v = null, f = null;
  return {
    set(g, fr) {
      if (!live()) return;
      if (!s) { s = AC.createBufferSource(); s.buffer = nbuf(); s.loop = true; f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; v = AC.createGain(); v.gain.value = 0; s.connect(f); f.connect(v); v.connect(MASTER); s.start(); }
      v.gain.setTargetAtTime(g, AC.currentTime, 0.05);
      if (fr) f.frequency.setTargetAtTime(fr, AC.currentTime, 0.05);
    }
  };
}
let lastBuzz = 0;
function buzz(ms, force) {
  if (BOT) return; const n = performance.now();
  if (!force && n - lastBuzz < 70) return; lastBuzz = n;
  try { navigator.vibrate && navigator.vibrate(ms); } catch (_) {}
}

// ── 그리기 조각 ──
const FONT = 'system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif';
function T(s, x, y, size = 20, col = C.cream, al = 'center', wt = 700, base = 'middle') {
  ctx.font = `${wt} ${size}px ${FONT}`; ctx.fillStyle = col; ctx.textAlign = al; ctx.textBaseline = base; ctx.fillText(s, x, y);
}
function TS(s, x, y, size = 24, col = C.cream, al = 'center', wt = 900) {   // 외곽선 있는 안내 글자
  ctx.font = `${wt} ${size}px ${FONT}`; ctx.textAlign = al; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(11,24,32,0.9)'; ctx.strokeText(s, x, y);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function panel(x, y, w, h, fill = C.cream, stroke = C.ink, r = 16) { rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = stroke; ctx.stroke(); }
function button(id, label, x, y, w, h, col = C.gold, size = 24) {
  btns.push({ id, x, y, w, h });
  rr(x, y + 5, w, h, 14); ctx.fillStyle = C.ink; ctx.fill();
  panel(x, y, w, h, col, C.ink, 14); T(label, x + w / 2, y + h / 2 + 1, size, C.ink, 'center', 800);
}
function star(x, y, r, on) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr_ = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr_, y + Math.sin(a) * rr_); }
  ctx.closePath(); ctx.fillStyle = on ? C.gold : '#3A5563'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = C.ink; ctx.stroke();
}
function ellipse(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, Math.PI * 2); }
// 글 상자 (여러 줄)
function lines(arr, x, y, size = 20, col = C.ink, gap = 1.45, al = 'left', wt = 600) { arr.forEach((s, i) => T(s, x, y + i * size * gap, size, col, al, wt)); }

function titleCard(title, sub, howto, levels) {
  ctx.fillStyle = 'rgba(11,24,32,0.72)'; ctx.fillRect(0, 0, W, H);
  panel(70, 110, 660, 580);
  T(title, W / 2, 175, 40, C.ink, 'center', 900);
  T(sub, W / 2, 222, 19, '#5B6F78', 'center', 600);
  lines(howto, 115, 290, 21, C.ink, 1.6);
  if (levels) levels.forEach((l, i) => button(l.id, l.label, 115 + i * 196, 590, 176, 70, l.col || C.gold, 22));
  else button('start', '시작', W / 2 - 110, 590, 220, 70);
}
function resultCard(title, stars, rows, comment, col = C.ink, opt) {
  ctx.fillStyle = 'rgba(11,24,32,0.72)'; ctx.fillRect(0, 0, W, H);
  panel(90, 100, 620, 600);
  T(title, W / 2, 160, 36, col, 'center', 900);
  for (let i = 0; i < 3; i++) star(W / 2 - 70 + i * 70, 222, 26, i < stars);
  rows.forEach(([k, v], i) => { T(k, 140, 300 + i * 44, 22, '#3A4E57', 'left', 600); T(String(v), 660, 300 + i * 44, 24, C.ink, 'right', 800); });
  if (comment) lines(Array.isArray(comment) ? comment : [comment], W / 2, 300 + rows.length * 44 + 26, 19, '#5B6F78', 1.45, 'center', 600);
  if (opt && opt.next) {
    button('retry', '다시', W / 2 - 280, 600, 170, 66);
    button('next', '다음 스테이지', W / 2 - 95, 600, 220, 66, C.green, 22);
    button('title', '목록', W / 2 + 140, 600, 140, 66, C.cream);
  } else {
    button('retry', '다시 하기', W / 2 - 250, 600, 230, 66);
    button('title', '처음으로', W / 2 + 20, 600, 230, 66, C.cream);
  }
}

// ── 스테이지 · 난이도 ──
const TIERS = ['입문', '보통', '장인'], TIER_COL = [C.green, C.gold, '#F08A5D'];
const SAVE = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} },
};
const Q_STAGE = QS.get('stage') ? +QS.get('stage') - 1 : null, Q_TIER = QS.get('tier') ? +QS.get('tier') - 1 : null;
function bestStars(key, i, t) { const b = SAVE.get(key, {}); return b[i + '_' + t] || 0; }
function saveStars(key, i, t, s) { const b = SAVE.get(key, {}); if ((b[i + '_' + t] || 0) < s) { b[i + '_' + t] = s; SAVE.set(key, b); } }
// 스테이지 목록 화면: 버튼 id = tier0..2, stage0..n
function stageMenu(o) {
  ctx.fillStyle = 'rgba(11,24,32,0.78)'; ctx.fillRect(0, 0, W, H);
  panel(50, 40, 700, 720);
  T(o.title, W / 2, 92, 38, C.ink, 'center', 900);
  T(o.sub, W / 2, 132, 18, '#5B6F78', 'center', 600);
  lines(o.how, 90, 172, 17, '#2F434C', 1.5, 'left', 600);
  const ty = 172 + o.how.length * 25 + 8;
  T('난이도', 90, ty + 26, 18, C.ink, 'left', 800);
  TIERS.forEach((n, i) => {
    const on = i === o.tier;
    button('tier' + i, (on ? '● ' : '') + n, 190 + i * 180, ty, 160, 52, on ? TIER_COL[i] : '#E4DCC8', 20);
  });
  T(o.tierNote[o.tier], W / 2, ty + 78, 15, '#5B6F78', 'center', 600);
  const y0 = ty + 104, gap = Math.min(80, (700 - y0) / o.stages.length);
  o.stages.forEach((s, i) => {
    const y = y0 + i * gap, h = gap - 12;
    btns.push({ id: 'stage' + i, x: 90, y, w: 620, h });
    rr(90, y + 4, 620, h, 14); ctx.fillStyle = C.ink; ctx.fill();
    panel(90, y, 620, h, '#FFFDF6', C.ink, 14);
    T(`${i + 1}`, 122, y + h / 2, 26, C.ink, 'center', 900);
    T(s.name, 150, y + h / 2 - 11, 20, C.ink, 'left', 800);
    T(s.tw, 150, y + h / 2 + 13, 14, '#5B6F78', 'left', 600);
    const b = bestStars(o.key, i, o.tier);
    for (let k = 0; k < 3; k++) star(620 + k * 30, y + h / 2, 11, k < b);
  });
}

// 검증용: 판이 끝나면 결과를 문서 제목과 #out에 남긴다
// ── 사람 모델 (bot=3) ── [가정] 타깃 실력 3단계. 값의 근거는 README '사람 모델' 절
// rt 지각→행동 지연(s) · ctl 힘·속도 조절 흔들림(변동계수) · trace 선 따라가기 흔들림(px, PC 마우스 기준)
// miss 신호 놓침 · imp 참을성(s) · wig 흔들기 요령 사용 비율 · over 물 두 번 붓기 · attn 다른 일 처리 지연 배율
// anticip 예측 행동 · rush 순간적으로 서두르는 빈도
const SKILL = {
  low:  { rt: 0.42, ctl: 0.30, trace: 10, miss: 0.25, imp: 1.6, wig: 0.15, over: 0.40, attn: 1.6, anticip: false, rush: 0.25 },
  mid:  { rt: 0.30, ctl: 0.20, trace: 7,  miss: 0.12, imp: 2.6, wig: 0.50, over: 0.25, attn: 1.0, anticip: false, rush: 0.12 },
  high: { rt: 0.22, ctl: 0.11, trace: 4,  miss: 0.04, imp: 4.0, wig: 0.90, over: 0.08, attn: 0.7, anticip: true,  rush: 0.04 },
};
const HS = { ...SKILL[QS.get('sk') || 'mid'] };
const DEV = QS.get('dev') === 'mobile' ? { trace: 2.5, ctl: 1.25 } : { trace: 1, ctl: 1 };   // 손가락은 마우스보다 크게 흔들린다 [가정]
HS.ctl *= DEV.ctl;
let HB = {};
function gauss() { let u = 0; while (u === 0) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd()); }
function ou(o, dt, tau, sig) { o.v = (o.v || 0) - (o.v || 0) / tau * dt + sig * Math.sqrt(2 * dt / tau) * gauss(); return o.v; }
function Lag() { const b = []; return { push(t, v) { b.push([t, v]); while (b.length > 2 && b[1][0] <= t - 2) b.shift(); }, get(t) { for (let i = b.length - 1; i >= 0; i--) if (b[i][0] <= t) return b[i][1]; return b.length ? b[0][1] : null; } }; }

let DONE = false, LAST = null;
function report(obj) { DONE = true; LAST = obj; const s = JSON.stringify(obj); document.title = 'DONE ' + s; const el = document.getElementById('out'); if (el) el.textContent = s; }

// ── 루프 ──
let last = performance.now(), NOW = 0, FRAMES = 0, PNGF = 0;
function frame(now) {
  const dt = BOT ? 1 / 60 : Math.min(0.05, (now - last) / 1000); last = now;
  for (let i = 0; i < (BOT ? FAST : 1); i++) { NOW += dt; if (BOT && G.bot) G.bot(dt); G.update(dt); }
  refit();
  btns = [];
  ctx.setTransform(DPR * SC, 0, 0, DPR * SC, 0, 0);
  if (!BOT || (FRAMES++ % 30) === 0) G.draw();
  if (!BOT && QS.get('png') && ++PNGF === 3) document.getElementById('out').setAttribute('data-png', cv.toDataURL('image/png'));   // 검증용 화면 추출
  if (BOT) setTimeout(() => frame(performance.now()), 0); else requestAnimationFrame(frame);
}
function boot() {
  if (!BOT) { requestAnimationFrame(frame); return; }
  // 검증 봇: 타이머 없이 한 번에 끝까지 시뮬레이션하고 마지막 화면만 그린다
  const dt = 1 / 60;
  const SHOT = +(QS.get('shot') || 0);   // 스크린샷용: 이 시각에서 멈춤
  const RUNS = +(QS.get('runs') || 1), base = seed, all = [];
  for (let r = 0; r < RUNS; r++) {
    if (r > 0) { seed = base + r * 7919; DONE = false; LAST = null; NOW = 0; HB = {}; G.reset(); }
    let i = 0;
    for (; i < 60 * 900 && !DONE && !(SHOT && NOW >= SHOT); i++) { NOW += dt; G.bot(dt); G.update(dt); }
    if (!DONE && !SHOT) report({ timeout: true, steps: i });
    all.push(LAST);
  }
  if (RUNS > 1) document.getElementById('out').textContent = JSON.stringify(all);
  const fin = () => { fit(); ctx.setTransform(DPR * SC, 0, 0, DPR * SC, 0, 0); G.draw(); };
  fin(); addEventListener('load', fin);
  if (QS.get('png')) { const o = document.getElementById('out'); o.setAttribute('data-png', cv.toDataURL('image/png')); }
}

// ── 독살 (돌담 그물) ──
// 썰물에 물고기가 바다로 빠져나가는 길을 돌로 막아, 웅덩이에 가둔다. 실시간 조작 없이 배치하고 물때를 지켜본다.
// 숭어는 물이 빠지기 시작하면 일찍 떠나고, 전어는 늦게, 치어는 아주 늦게 떠난다. 치어를 가두면 감점(놓아줘야 한다).
const COLS = 10, ROWS = 8, WALL = 3, HIGH = 3.5, LOW = 0.5, STEP = 0.25;
const FISHT = {   // [튜닝] 물고기 테이블 — leave: 이 깊이보다 얕아지면 바다로 떠남 · spd: 물높이 한 단계당 칸 수
  mullet: { name: '숭어', v: 3, leave: 1.6, spd: 2, col: '#9AA9B2', len: 30 },
  gizzard: { name: '전어', v: 2, leave: 1.0, spd: 2, col: '#C3CFD6', len: 24 },
  fry: { name: '치어', v: -3, leave: 0.6, spd: 1, col: '#F2D06B', len: 15 },
};
// 지형: 0 깊음 · 1 얕은 모래 · 2 바위 둑 · 4 뭍. 맨 아래 줄 = 먼바다
const STAGES = [   // [튜닝] 스테이지 테이블 — k: 보통 기준 돌 수, fish: [종, 열, 행], par: 난이도별 최고 점수(봇 bot=1이 계산, 표를 고치면 다시 계산)
  { name: '작은 만', tw: '둑이 터진 곳을 막기', k: 2, par: [5, 5, 5],
    grid: ['4444444444', '2222222222', '2000000002', '2000000002', '2000000002', '2000000002', '2222002222', '0000000000'],
    fish: [['mullet', 3, 3], ['gizzard', 6, 4]] },
  { name: '두 웅덩이', tw: '돌이 모자라요 — 더 값진 쪽을', k: 2, par: [9, 7, 7],
    grid: ['4444444444', '2222222222', '2000200002', '2000200002', '2000200002', '2200222022', '0000000000', '0000000000'],
    fish: [['mullet', 2, 3], ['gizzard', 3, 2], ['gizzard', 6, 3], ['gizzard', 7, 2]] },
  { name: '치어를 놓아주기', tw: '치어가 빠져나갈 물길은 남기기', k: 3, par: [5, 5, 5],
    grid: ['4444444444', '2222222222', '2000020002', '2000020002', '2000000002', '2220000222', '0000000000', '0000000000'],
    fish: [['mullet', 2, 3], ['gizzard', 3, 4], ['fry', 7, 3], ['fry', 8, 2]] },
  { name: '넓은 갯벌', tw: '둑이 여기저기 낮아요', k: 3, par: [10, 8, 10],
    grid: ['4444444444', '3322223333', '2000110002', '2010000102', '2000100002', '2110001102', '0200200020', '0000000000'],
    fish: [['mullet', 2, 2], ['mullet', 6, 3], ['gizzard', 4, 4], ['gizzard', 8, 3], ['fry', 3, 4]] },
  { name: '큰 물때', tw: '두 웅덩이 + 치어 + 낮은 둑', k: 4, par: [8, 8, 4],
    grid: ['4444444444', '2222222222', '2000210002', '2000210002', '2001000102', '2100200012', '2201220022', '0000000000'],
    fish: [['mullet', 1, 2], ['mullet', 7, 3], ['gizzard', 3, 4], ['gizzard', 6, 2], ['fry', 2, 3], ['fry', 8, 4]] },
];
const TIER_K = [1, 0, 0], FUZZY = [false, false, true];   // 입문 돌 +1 · 장인은 물고기 자리가 대략으로만 보임
const KEY = 'prep-dokssal';

let st = 'menu', tier = Q_TIER ?? 0, si = 0, S = null, stones = new Set(), spots = [], par = 0, parSet = null, rec = null, playT = 0, result = null, msgS = '', msgT = 0;
const CELL = 62, OX = 90, OY = 150;

const ground = (x, y) => +S.grid[y][x];
function simulate(stn, sp, record) {
  const h = (x, y) => stn.has(y * COLS + x) ? WALL : ground(x, y);
  const fish = sp.map(f => ({ ...f, st: 'stay', path: record ? [[f.x, f.y]] : null }));
  const levels = []; for (let L = HIGH; L >= LOW - 1e-9; L -= STEP) levels.push(L);
  const frames = [];
  for (const L of levels) {
    const wet = (x, y) => h(x, y) < L;
    // 바다와 이어진 물 = 맨 아래 줄에서 시작한 BFS 거리
    const dist = new Array(COLS * ROWS).fill(-1), q = [];
    for (let x = 0; x < COLS; x++) if (wet(x, ROWS - 1)) { dist[(ROWS - 1) * COLS + x] = 0; q.push([x, ROWS - 1]); }
    for (let i = 0; i < q.length; i++) { const [x, y] = q[i]; for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || !wet(nx, ny) || dist[ny * COLS + nx] >= 0) continue; dist[ny * COLS + nx] = dist[y * COLS + x] + 1; q.push([nx, ny]); } }
    for (const f of fish) {
      if (f.st !== 'stay' && f.st !== 'go') continue;
      if (!wet(f.x, f.y) || dist[f.y * COLS + f.x] < 0) { f.st = 'caught'; continue; }   // 웅덩이에 갇히거나 뭍에 남음
      if (f.st === 'go' || L - ground(f.x, f.y) < FISHT[f.t].leave) {
        f.st = 'go';
        for (let k = 0; k < FISHT[f.t].spd; k++) {
          let best = null, bd = dist[f.y * COLS + f.x];
          for (const [dx, dy] of [[0, 1], [1, 0], [-1, 0], [0, -1]]) { const nx = f.x + dx, ny = f.y + dy; if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue; const d = dist[ny * COLS + nx]; if (d >= 0 && d < bd) { bd = d; best = [nx, ny]; } }
          if (best) { f.x = best[0]; f.y = best[1]; }
          if (f.y === ROWS - 1) { f.st = 'free'; break; }
        }
      }
      if (record) f.path.push([f.x, f.y]);
    }
    if (record) frames.push({ L, fish: fish.map(f => ({ x: f.x, y: f.y, st: f.st })) });
  }
  for (const f of fish) if (f.st === 'stay' || f.st === 'go') f.st = 'free';
  const score = fish.reduce((a, f) => a + (f.st === 'caught' ? FISHT[f.t].v : 0), 0);
  return { score, fish, frames };
}
// 최적해: 얕은 칸(0·1) 전부를 후보로, 돌 4개까지는 모든 조합 · 5개부터는 4개 최적해에 하나씩 더하기
function candidates() {
  const c = [];
  for (let y = 1; y < ROWS - 1; y++) for (let x = 0; x < COLS; x++) if (ground(x, y) <= 1) c.push(y * COLS + x);
  return c;
}
function solve(k) {
  const c = candidates(), all = []; let best = { v: simulate(new Set(), spots).score, set: [] }, n = 0;
  const kk = Math.min(k, 4);
  (function rec_(start, chosen) {
    if (chosen.length) { const v = simulate(new Set(chosen), spots).score; n++; all.push(v); if (v > best.v) best = { v, set: chosen.slice() }; }
    if (chosen.length === kk) return;
    for (let i = start; i < c.length; i++) { chosen.push(c[i]); rec_(i + 1, chosen); chosen.pop(); }
  })(0, []);
  for (let extra = kk; extra < k; extra++) {
    let b2 = best; for (const id of c) if (!best.set.includes(id)) { const set = best.set.concat([id]), v = simulate(new Set(set), spots).score; if (v > b2.v) b2 = { v, set }; }
    best = b2;
  }
  const good = all.filter(v => v >= best.v * 0.8 && v > 0).length;
  return { ...best, n, good, cand: c.length };
}
function startStage(i, t) {
  si = i; tier = t; S = STAGES[i]; st = 'plan'; stones = new Set(); rec = null; result = null;
  let ls = 1000 + i * 101; const lr = () => { ls = (ls * 16807) % 2147483647; return ls / 2147483647; };   // 장인 위치는 스테이지마다 고정
  spots = S.fish.map(([tp, x, y]) => {
    let sx = x, sy = y;
    if (FUZZY[tier]) for (let k = 0; k < 10; k++) { const nx = x + Math.round(lr() * 2 - 1), ny = y + Math.round(lr() * 2 - 1); if (ny > 1 && ny < ROWS - 2 && nx > 0 && nx < COLS - 1 && ground(nx, ny) <= 1) { sx = nx; sy = ny; break; } }
    return { t: tp, x: sx, y: sy, hx: x, hy: y };
  });
  if (BOT || !S.par) { const sol = solve(S.k + TIER_K[tier]); par = sol.v; parSet = sol; } else { par = S.par[tier]; parSet = null; }
}
const stonesMax = () => S.k + TIER_K[tier];
function toggle(x, y) {
  if (y < 1 || y >= ROWS - 1 || ground(x, y) >= WALL) return;
  const id = y * COLS + x;
  if (stones.has(id)) { stones.delete(id); tone(300, 0.06, 'sine', 0.06); }
  else { if (stones.size >= stonesMax()) { say('돌을 다 썼어요 — 놓인 돌을 눌러 빼요'); return; } stones.add(id); noise(0.12, 0.35, 700, 1.2); tone(160, 0.08, 'triangle', 0.12); buzz(15, true); }
}
function say(s) { msgS = s; msgT = 1.6; }
function play() { rec = simulate(stones, spots, true); st = 'tide'; playT = 0; noise(1.2, 0.15, 500, 0.5, 'lowpass'); }
function finish() {
  const v = rec.score, stars = par <= 0 ? (v >= 0 ? 3 : 0) : v >= par ? 3 : v >= par * 0.6 ? 2 : v > 0 ? 1 : 0;
  result = { v, stars, caught: rec.fish.filter(f => f.st === 'caught' && f.t !== 'fry').length, fry: rec.fish.filter(f => f.st === 'caught' && f.t === 'fry').length };
  saveStars(KEY, si, tier, stars); st = 'result';
  report({ game: 'dokssal', stage: si + 1, tier: tier + 1, v, par, stars, combos: parSet.n, good: parSet.good, cand: parSet.cand, randAvg: randomAvg() });
}
function randomAvg() {   // 비교용: 후보 칸 중 무작위로 돌 k개를 놓았을 때 평균 점수
  const c = candidates(); let s = 0; const N = 200;
  for (let i = 0; i < N; i++) { const pick = new Set(); while (pick.size < Math.min(stonesMax(), c.length)) pick.add(c[Math.floor(rnd() * c.length)]); s += simulate(pick, spots).score; }
  return +(s / N).toFixed(2);
}

const TIDE_IN = 2.5, TIDE_OUT = 6.5;
const G = {
  reset() { st = 'menu'; },
  onButton(id) {
    if (id.startsWith('tier')) tier = +id.slice(4);
    else if (id.startsWith('stage')) startStage(+id.slice(5), tier);
    else if (id === 'retry') { st = 'plan'; rec = null; }
    else if (id === 'next') startStage(Math.min(si + 1, STAGES.length - 1), tier);
    else if (id === 'title') st = 'menu';
    else if (id === 'go') play();
    else if (id === 'clear') stones = new Set();
    else if (id === 'skip') playT = TIDE_IN + TIDE_OUT + 1;
  },
  onDown(x, y) { if (st !== 'plan') return; const cx = Math.floor((x - OX) / CELL), cy = Math.floor((y - OY) / CELL); if (cx >= 0 && cy >= 0 && cx < COLS && cy < ROWS) toggle(cx, cy); },
  update(dt) {
    if (msgT > 0) msgT -= dt;
    if (st === 'tide') { playT += dt; if (playT > TIDE_IN + TIDE_OUT + 0.6) finish(); }
  },
  bot(dt) {
    if (st === 'menu') { startStage(Q_STAGE ?? 0, Q_TIER ?? 0); return; }
    if (st === 'plan') { if (BOT === 1) stones = new Set(parSet.set); else { const c = candidates(); stones = new Set(); while (stones.size < Math.min(stonesMax(), c.length)) stones.add(c[Math.floor(rnd() * c.length)]); } play(); playT = 99; }
  },
  draw() {
    ctx.fillStyle = '#1B2E39'; ctx.fillRect(0, 0, W, H);
    if (st === 'menu') {
      stageMenu({ title: '독살', sub: '돌담으로 썰물에 물고기를 가둬요', key: KEY, tier, stages: STAGES,
        how: ['· 칸을 눌러 돌을 놓고(다시 누르면 빼기) "물때 보기"', '· 물이 빠질 때 바다로 가는 길이 막힌 웅덩이에 물고기가 갇혀요', '· 숭어는 일찍, 전어는 늦게 떠나요. 치어는 가두면 감점!'],
        tierNote: ['돌 +1개 · 물고기 자리가 정확히 보여요', '딱 맞는 돌 수 · 물고기 자리가 보여요', '물고기 자리가 대략으로만 보여요 (한 칸쯤 다를 수 있어요)'] });
      return;
    }
    // 물높이
    let L = HIGH, frame = null;
    if (st === 'tide' || st === 'result') {
      if (playT < TIDE_IN) L = lerp(LOW, HIGH, playT / TIDE_IN);
      else { const k = clamp((playT - TIDE_IN) / TIDE_OUT, 0, 1), fi = Math.min(rec.frames.length - 1, Math.floor(k * (rec.frames.length - 1))); L = rec.frames[fi].L; frame = { fi, k: k * (rec.frames.length - 1) - fi }; }
    } else L = 1.2;
    // 지형 + 물
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const g = ground(x, y), px = OX + x * CELL, py = OY + y * CELL, isS = stones.has(y * COLS + x);
      ctx.fillStyle = g === 4 ? '#D8C08C' : g === 3 ? '#6E6A62' : g === 2 ? '#8A8173' : g === 1 ? '#C9B48A' : '#A89270';
      ctx.fillRect(px, py, CELL + 0.5, CELL + 0.5);
      const hh = isS ? WALL : g, depth = L - hh;
      if (depth > 0 && g !== 4) { ctx.fillStyle = `rgba(52,128,160,${clamp(0.25 + depth * 0.18, 0, 0.8)})`; ctx.fillRect(px, py, CELL + 0.5, CELL + 0.5); }
      if (g === 2 || g === 3) { ctx.fillStyle = 'rgba(60,55,50,0.5)'; for (let k = 0; k < 3; k++) { ellipse(px + 14 + k * 17, py + 20 + (k % 2) * 20, 9, 7); ctx.fill(); } }
      if (isS) { for (let k = 0; k < 4; k++) { ellipse(px + 16 + (k % 2) * 28, py + 18 + Math.floor(k / 2) * 26, 15, 12); ctx.fillStyle = '#5E5A55'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = C.ink; ctx.stroke(); } }
    }
    ctx.lineWidth = 4; ctx.strokeStyle = C.ink; ctx.strokeRect(OX, OY, COLS * CELL, ROWS * CELL);
    T('먼바다 ↓', OX + COLS * CELL / 2, OY + ROWS * CELL + 18, 14, C.cream, 'center', 700);
    // 물고기
    if (st === 'plan') {
      spots.forEach(f => {
        const ft = FISHT[f.t];
        if (FUZZY[tier]) { ellipse(OX + (f.hx + 0.5) * CELL, OY + (f.hy + 0.5) * CELL, CELL * 1.3, CELL * 1.1); ctx.fillStyle = f.t === 'fry' ? 'rgba(242,208,107,0.28)' : 'rgba(255,255,255,0.22)'; ctx.fill(); drawFish(OX + (f.hx + 0.5) * CELL, OY + (f.hy + 0.5) * CELL, f.t, 0.5, 0); }
        else drawFish(OX + (f.x + 0.5) * CELL, OY + (f.y + 0.5) * CELL, f.t, 0.85, 0);
      });
    } else {
      rec.fish.forEach((f, i) => {
        let x, y, stt = 'stay';
        if (playT < TIDE_IN) { const k = clamp(playT / TIDE_IN, 0, 1); x = f.path[0][0]; y = lerp(ROWS - 0.5, f.path[0][1], k) - 0.0; x = lerp(f.path[0][0], f.path[0][0], k); }
        else { const fi = frame.fi, a = f.path[Math.min(fi, f.path.length - 1)], b = f.path[Math.min(fi + 1, f.path.length - 1)]; x = lerp(a[0], b[0], frame.k); y = lerp(a[1], b[1], frame.k); stt = rec.frames[fi].fish[i].st; }
        if (stt === 'free' && y >= ROWS - 1.01) return;
        drawFish(OX + (x + 0.5) * CELL + Math.sin(playT * 6 + i) * 4, OY + (y + 0.5) * CELL, f.t, 1, playT * 8 + i, stt === 'caught');
      });
    }
    // 상단
    panel(20, 16, 760, 118, 'rgba(255,243,220,0.96)');
    T(`${si + 1}. ${S.name}`, 40, 44, 22, C.ink, 'left', 900);
    T(`${TIERS[tier]} · ${S.tw}`, 40, 74, 14, '#5B6F78', 'left', 700);
    T('돌', 40, 108, 15, C.ink, 'left', 800);
    for (let i = 0; i < stonesMax(); i++) { ellipse(78 + i * 30, 108, 11, 9); ctx.fillStyle = i < stonesMax() - stones.size ? '#6A655F' : 'rgba(106,101,95,0.25)'; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = C.ink; ctx.stroke(); }
    Object.entries(FISHT).forEach(([k, f], i) => { drawFish(330 + i * 150, 108, k, 0.7, 0); T(`${f.name} ${f.v > 0 ? '+' : ''}${f.v}`, 352 + i * 150, 108, 14, f.v < 0 ? C.red : C.ink, 'left', 800); });
    T(st === 'plan' ? '' : `물높이 ${L.toFixed(1)}`, 760, 44, 16, '#2F6F8F', 'right', 800);
    if (st === 'plan') { button('clear', '돌 모두 빼기', 40, 680, 210, 62, C.cream, 20); button('go', '물때 보기 ▶', 520, 680, 240, 62, C.green, 22); }
    if (st === 'tide') button('skip', '건너뛰기', 600, 690, 160, 54, C.cream, 18);
    if (msgT > 0) TS(msgS, W / 2, 660, 18, C.gold);
    if (st === 'result') {
      const r = result;
      resultCard(r.stars === 3 ? '만선!' : r.stars === 2 ? '꽤 잡았어요' : r.stars === 1 ? '조금 잡았어요' : '빈 웅덩이…', r.stars, [
        ['점수', `${r.v} / 최고 ${par}`], ['잡은 물고기', r.caught], ['갇힌 치어', r.fry]],
        r.fry ? '치어가 빠져나갈 물길을 남겨 봐요' : r.stars < 3 ? '물이 어디로 빠져나가는지 따라가 봐요' : '', C.ink, { next: si + 1 < STAGES.length });
      button('retry', '돌 다시 놓기', W / 2 - 280, 600, 170, 66, C.gold, 18);
    }
  }
};
function drawFish(x, y, t, s, ph, trapped) {
  const f = FISHT[t], L = f.len * s; ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(ph) * 0.2);
  ellipse(0, 0, L / 2, L / 5); ctx.fillStyle = f.col; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(L / 2, 0); ctx.lineTo(L / 2 + L / 4, -L / 6); ctx.lineTo(L / 2 + L / 4, L / 6); ctx.closePath(); ctx.fillStyle = f.col; ctx.fill(); ctx.stroke();
  ellipse(-L / 3, -L / 20, 1.8, 1.8); ctx.fillStyle = C.ink; ctx.fill();
  if (trapped) { ellipse(0, 0, L / 2 + 8, L / 4 + 8); ctx.strokeStyle = t === 'fry' ? C.red : C.gold; ctx.lineWidth = 3; ctx.stroke(); }
  ctx.restore();
}
if (Q_STAGE !== null && !BOT) startStage(Q_STAGE, Q_TIER ?? 0);
boot();
