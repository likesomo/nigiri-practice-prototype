<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>이쿠라 풀기</title>
<style>html,body{margin:0;height:100%;background:#132430;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}canvas{display:block;touch-action:none}
#back{position:fixed;left:10px;top:8px;font:600 13px system-ui,'Malgun Gothic',sans-serif;color:#9DB4B6;text-decoration:none;z-index:2}#out{display:none}</style>
</head><body><a id="back" href="./">← 실험실</a><canvas id="c"></canvas><pre id="out"></pre>
<script>
'use strict';
window.onerror = (m, s, l, c) => { const o = document.getElementById('out'); if (o) o.textContent = 'ERR ' + m + ' @' + l + ':' + c; };
// ── 공통 뼈대: 화면 맞춤 · 입력 · 소리 · 진동 · UI 조각 · 봇/검증 훅 ──
const W = 800, H = 800;
const QS = new URLSearchParams(location.search);
const BOT = +(QS.get('bot') || 0);            // 1 = 잘하는 봇, 2 = 서툰 봇 (검증용)
const FAST = Math.max(1, +(QS.get('fast') || 1));
let seed = +(QS.get('seed') || (Date.now() % 1e9));
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const R = (a, b) => a + (b - a) * rnd();
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const C = { bg: '#132430', bg2: '#1B3442', cream: '#FFF3DC', gold: '#F7B94E', red: '#E5533D', teal: '#3FA7A0', green: '#7BC96F', wood: '#C98B4F', wood2: '#A86F3B', ink: '#0B1820', dim: '#9DB4B6' };

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let DPR = 1, SC = 1;
function fit() {
  DPR = Math.min(2, devicePixelRatio || 1);
  const de = document.documentElement, s = Math.floor(Math.min(innerWidth || de.clientWidth, innerHeight || de.clientHeight)) || 800;
  SC = s / W; cv.style.width = s + 'px'; cv.style.height = s + 'px';
  cv.width = Math.round(s * DPR); cv.height = Math.round(s * DPR);
}
addEventListener('resize', fit); addEventListener('load', fit); fit();
let lastFit = '';
function refit() { const k = innerWidth + 'x' + innerHeight; if (k !== lastFit) { lastFit = k; fit(); } }

// ── 입력 ──
const P = { x: W / 2, y: H / 2, down: false, id: null };
let btns = [];
function toL(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
cv.addEventListener('pointerdown', e => {
  ac(); e.preventDefault();
  const [x, y] = toL(e);
  for (const b of btns) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { G.onButton && G.onButton(b.id); return; }
  if (BOT) return;
  if (P.down) return;               // 두 번째 손가락은 버튼만
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  P.x = x; P.y = y; P.down = true; P.id = e.pointerId;
  G.onDown && G.onDown(x, y);
});
cv.addEventListener('pointermove', e => {
  if (BOT || e.pointerId !== P.id) return;
  const [x, y] = toL(e); P.x = x; P.y = y; G.onMove && G.onMove(x, y);
});
function up(e) { if (BOT || e.pointerId !== P.id) return; P.down = false; P.id = null; G.onUp && G.onUp(); }
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
addEventListener('keydown', e => { ac(); G.onKey && G.onKey(e.code); });

// ── 소리 (WebAudio 합성, 외부 파일 없음) ──
let AC = null, MASTER = null, NB = null;
function ac() {
  if (BOT) return null;
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); MASTER = AC.createGain(); MASTER.gain.value = 0.55; MASTER.connect(AC.destination); } catch (_) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
const live = () => AC && AC.state === 'running';
function tone(f, d = 0.1, type = 'sine', g = 0.2, f2 = 0) {
  if (!live()) return;
  const t = AC.currentTime, o = AC.createOscillator(), v = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(v); v.connect(MASTER); o.start(t); o.stop(t + d + 0.02);
}
function nbuf() { if (!NB) { NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } return NB; }
function noise(d = 0.1, g = 0.2, freq = 1200, q = 1, type = 'bandpass') {
  if (!live()) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), v = AC.createGain();
  s.buffer = nbuf(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(0.001, t + d);
  s.connect(f); f.connect(v); v.connect(MASTER); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.02);
}
function loopNoise(freq = 900, q = 0.8) {   // 문지르기처럼 계속 나는 소리
  let s = null, v = null, f = null;
  return {
    set(g, fr) {
      if (!live()) return;
      if (!s) { s = AC.createBufferSource(); s.buffer = nbuf(); s.loop = true; f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; v = AC.createGain(); v.gain.value = 0; s.connect(f); f.connect(v); v.connect(MASTER); s.start(); }
      v.gain.setTargetAtTime(g, AC.currentTime, 0.05);
      if (fr) f.frequency.setTargetAtTime(fr, AC.currentTime, 0.05);
    }
  };
}
let lastBuzz = 0;
function buzz(ms, force) {
  if (BOT) return; const n = performance.now();
  if (!force && n - lastBuzz < 70) return; lastBuzz = n;
  try { navigator.vibrate && navigator.vibrate(ms); } catch (_) {}
}

// ── 그리기 조각 ──
const FONT = 'system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif';
function T(s, x, y, size = 20, col = C.cream, al = 'center', wt = 700, base = 'middle') {
  ctx.font = `${wt} ${size}px ${FONT}`; ctx.fillStyle = col; ctx.textAlign = al; ctx.textBaseline = base; ctx.fillText(s, x, y);
}
function TS(s, x, y, size = 24, col = C.cream, al = 'center', wt = 900) {   // 외곽선 있는 안내 글자
  ctx.font = `${wt} ${size}px ${FONT}`; ctx.textAlign = al; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(11,24,32,0.9)'; ctx.strokeText(s, x, y);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function panel(x, y, w, h, fill = C.cream, stroke = C.ink, r = 16) { rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = stroke; ctx.stroke(); }
function button(id, label, x, y, w, h, col = C.gold, size = 24) {
  btns.push({ id, x, y, w, h });
  rr(x, y + 5, w, h, 14); ctx.fillStyle = C.ink; ctx.fill();
  panel(x, y, w, h, col, C.ink, 14); T(label, x + w / 2, y + h / 2 + 1, size, C.ink, 'center', 800);
}
function star(x, y, r, on) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr_ = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr_, y + Math.sin(a) * rr_); }
  ctx.closePath(); ctx.fillStyle = on ? C.gold : '#3A5563'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = C.ink; ctx.stroke();
}
function ellipse(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, Math.PI * 2); }
// 글 상자 (여러 줄)
function lines(arr, x, y, size = 20, col = C.ink, gap = 1.45, al = 'left', wt = 600) { arr.forEach((s, i) => T(s, x, y + i * size * gap, size, col, al, wt)); }

function titleCard(title, sub, howto, levels) {
  ctx.fillStyle = 'rgba(11,24,32,0.72)'; ctx.fillRect(0, 0, W, H);
  panel(70, 110, 660, 580);
  T(title, W / 2, 175, 40, C.ink, 'center', 900);
  T(sub, W / 2, 222, 19, '#5B6F78', 'center', 600);
  lines(howto, 115, 290, 21, C.ink, 1.6);
  if (levels) levels.forEach((l, i) => button(l.id, l.label, 115 + i * 196, 590, 176, 70, l.col || C.gold, 22));
  else button('start', '시작', W / 2 - 110, 590, 220, 70);
}
function resultCard(title, stars, rows, comment, col = C.ink) {
  ctx.fillStyle = 'rgba(11,24,32,0.72)'; ctx.fillRect(0, 0, W, H);
  panel(90, 100, 620, 600);
  T(title, W / 2, 160, 36, col, 'center', 900);
  for (let i = 0; i < 3; i++) star(W / 2 - 70 + i * 70, 222, 26, i < stars);
  rows.forEach(([k, v], i) => { T(k, 140, 300 + i * 44, 22, '#3A4E57', 'left', 600); T(String(v), 660, 300 + i * 44, 24, C.ink, 'right', 800); });
  if (comment) lines(Array.isArray(comment) ? comment : [comment], W / 2, 300 + rows.length * 44 + 26, 19, '#5B6F78', 1.45, 'center', 600);
  button('retry', '다시 하기', W / 2 - 250, 600, 230, 66);
  button('title', '처음으로', W / 2 + 20, 600, 230, 66, C.cream);
}

// 검증용: 판이 끝나면 결과를 문서 제목과 #out에 남긴다
let DONE = false;
function report(obj) { DONE = true; const s = JSON.stringify(obj); document.title = 'DONE ' + s; const el = document.getElementById('out'); if (el) el.textContent = s; }

// ── 루프 ──
let last = performance.now(), NOW = 0, FRAMES = 0;
function frame(now) {
  const dt = BOT ? 1 / 60 : Math.min(0.05, (now - last) / 1000); last = now;
  for (let i = 0; i < (BOT ? FAST : 1); i++) { NOW += dt; if (BOT && G.bot) G.bot(dt); G.update(dt); }
  refit();
  btns = [];
  ctx.setTransform(DPR * SC, 0, 0, DPR * SC, 0, 0);
  if (!BOT || (FRAMES++ % 30) === 0) G.draw();
  if (BOT) setTimeout(() => frame(performance.now()), 0); else requestAnimationFrame(frame);
}
function boot() {
  if (!BOT) { requestAnimationFrame(frame); return; }
  // 검증 봇: 타이머 없이 한 번에 끝까지 시뮬레이션하고 마지막 화면만 그린다
  const dt = 1 / 60; let i = 0;
  const SHOT = +(QS.get('shot') || 0);   // 스크린샷용: 이 시각에서 멈춤
  for (; i < 60 * 900 && !DONE && !(SHOT && NOW >= SHOT); i++) { NOW += dt; G.bot(dt); G.update(dt); }
  if (!DONE && !SHOT) report({ timeout: true, steps: i });
  const fin = () => { fit(); ctx.setTransform(DPR * SC, 0, 0, DPR * SC, 0, 0); G.draw(); };
  fin(); addEventListener('load', fin);
  if (QS.get('png')) { const o = document.getElementById('out'); o.setAttribute('data-png', cv.toDataURL('image/png')); }
}

// ── 이쿠라 풀기 ──
// 미지근한 소금물 속에서 알주머니(스지코)를 망에 대고 문질러 알을 떼어 낸다.
// 손 = 문지르는 속도. 느리면 안 떨어지고, 빠르면 알이 터진다. 물이 식으면 막이 질겨지고, 너무 뜨거우면 알이 하얗게 익는다.
const SACS = [   // [튜닝] 알주머니 테이블
  { name: '첫 번째 알주머니', n: 80, bond: 1.0, V1: 170, V2: 520, R: 72 },
  { name: '두 번째 알주머니 (막이 더 질겨요)', n: 110, bond: 1.3, V1: 170, V2: 460, R: 86 },
];
const MESH = { x: 175, y: 205, w: 450, h: 430 };
const TEMP = { lo: 36, hi: 44, start: 40, cool: 0.38, pour: 4 };
const LIMIT = 80;

let st = 'title', sacI = 0, sac = null, eggs = [], drops = [], fx = [], ripples = [];
let temp = TEMP.start, time = 0, hint = '', hintCol = C.cream, pourT = 0, betweenT = 0;
let got = { ok: 0, cloud: 0, burst: 0, total: 0 }, bowl = [];
const rub = loopNoise(700, 0.7);

function makeSac(i) {
  const d = SACS[i]; eggs = [];
  const ga = Math.PI * (3 - Math.sqrt(5));
  for (let k = 0; k < d.n; k++) {
    const r = d.R * Math.sqrt((k + 0.5) / d.n), a = k * ga;
    eggs.push({ ox: Math.cos(a) * r, oy: Math.sin(a) * r * 0.86, edge: r / d.R, bond: d.bond * (1 + (1 - r / d.R) * 0.9), stress: 0, cloud: 0, st: 'on', wob: rnd() * 6, tough: R(0.75, 1.3) });
  }
  sac = { x: 400, y: 425, px: 400, py: 425, v: 0, d, held: false, gx: 0, gy: 0 };
  got.total += d.n;
}
function start() {
  sacI = 0; got = { ok: 0, cloud: 0, burst: 0, total: 0 }; bowl = []; drops = []; fx = []; ripples = [];
  temp = TEMP.start; time = 0; betweenT = 0; makeSac(0); st = 'play';
}
function pour() {
  if (st !== 'play') return;
  temp += TEMP.pour; pourT = 0.6; noise(0.5, 0.25, 500, 0.6, 'lowpass'); buzz(20);
  for (let i = 0; i < 6; i++) ripples.push({ x: 120 + R(-20, 20), y: 640 + R(-10, 10), r: 4, a: 1 });
}

const G = {
  onButton(id) {
    if (id === 'start' || id === 'retry') start();
    else if (id === 'title') st = 'title';
    else if (id === 'pour') pour();
  },
  onKey(c) { if (c === 'Space') { if (st === 'play') pour(); else if (st !== 'play') start(); } },
  onDown(x, y) {
    if (st !== 'play' || !sac) return;
    // 알주머니를 잡는다 (조금 벗어나도 잡히게)
    if (Math.hypot(x - sac.x, y - sac.y) < sac.d.R + 70) { sac.held = true; sac.gx = sac.x - x; sac.gy = sac.y - y; }
  },
  onUp() { if (sac) sac.held = false; },

  update(dt) {
    for (const r of ripples) { r.r += 60 * dt; r.a -= 1.4 * dt; }
    ripples = ripples.filter(r => r.a > 0);
    for (const f of fx) { f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.92; f.vy *= 0.92; f.a -= 1.6 * dt; }
    fx = fx.filter(f => f.a > 0);
    for (const d of drops) { d.t += dt * 2.2; }
    drops = drops.filter(d => { if (d.t >= 1) { bowl.push(d.cloud >= 1 ? 1 : 0); return false; } return true; });
    if (pourT > 0) pourT -= dt;
    if (st !== 'play') { rub.set(0); return; }

    time += dt;
    temp = Math.max(18, temp - TEMP.cool * dt);
    if (!sac) { betweenT -= dt; if (betweenT <= 0) { sacI++; if (sacI < SACS.length) makeSac(sacI); else finish(); } return; }

    // 알주머니 이동과 속도
    sac.px = sac.x; sac.py = sac.y;
    if (sac.held) {
      const tx = clamp(P.x + sac.gx, 120, 680), ty = clamp(P.y + sac.gy, 150, 700);
      const k = Math.min(1, dt * 22); sac.x += (tx - sac.x) * k; sac.y += (ty - sac.y) * k;
    }
    const inst = Math.hypot(sac.x - sac.px, sac.y - sac.py) / Math.max(dt, 1e-4);
    sac.v = lerp(sac.v, inst, Math.min(1, dt * 9));
    const onMesh = sac.held && sac.x > MESH.x && sac.x < MESH.x + MESH.w && sac.y > MESH.y && sac.y < MESH.y + MESH.h;
    const d = sac.d, v = sac.v;
    let eff = 0, over = 0;
    if (onMesh) { eff = v < d.V1 ? 0.25 * v / d.V1 : 1; if (v > d.V2) over = (v - d.V2) / 260; }
    const tempF = temp < TEMP.lo ? clamp(0.3 + 0.7 * (temp - 25) / (TEMP.lo - 25), 0.3, 1) : 1;
    rub.set(onMesh ? clamp(v / 900, 0, 0.35) : 0, 500 + v * 1.2);
    if (onMesh && v > 60 && rnd() < dt * 14) ripples.push({ x: sac.x + R(-60, 60), y: sac.y + R(-50, 50), r: 6, a: 0.7 });

    const on = eggs.filter(e => e.st === 'on');
    for (const e of on) {
      let nb = 0;
      for (const o of on) if (o !== e && Math.abs(o.ox - e.ox) < 24 && Math.abs(o.oy - e.oy) < 24) nb++;
      e.exp = clamp(1 - (nb - 2) / 5, 0.15, 1);
      e.bond -= eff * e.exp * tempF * 0.85 * dt;
      if (over > 0) e.stress += over * dt * (0.6 + e.exp) * 0.75 * e.tough;
      else e.stress = Math.max(0, e.stress - 0.6 * dt);
      if (temp > TEMP.hi) e.cloud += (temp - TEMP.hi) * 0.07 * dt;
      const wx = sac.x + e.ox, wy = sac.y + e.oy;
      if (e.stress >= 1) {
        e.st = 'burst'; got.burst++;
        for (let i = 0; i < 9; i++) { const a = R(0, 6.28), s = R(60, 220); fx.push({ x: wx, y: wy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, a: 1, r: R(2, 5), c: '#FF8A3A' }); }
        noise(0.12, 0.35, 2400, 2); tone(220, 0.08, 'triangle', 0.15, 90); buzz(45, true);
      } else if (e.bond <= 0) {
        e.st = 'free';
        if (e.cloud >= 1) got.cloud++; else got.ok++;
        drops.push({ x: wx, y: wy, t: 0, cloud: e.cloud });
        tone(R(900, 1300), 0.06, 'sine', 0.07, 1800); buzz(6);
      }
    }
    // 그릇 속 알도 뜨거운 물에선 익는다
    if (temp > TEMP.hi) for (let i = 0; i < bowl.length; i++) if (bowl[i] < 1 && rnd() < (temp - TEMP.hi) * 0.02 * dt) { bowl[i] = 1; got.ok--; got.cloud++; }

    // 안내
    if (!sac.held) { hint = '알주머니를 잡고 망 위에서 문질러요'; hintCol = C.cream; }
    else if (!onMesh) { hint = '망 위로 가져가요'; hintCol = C.cream; }
    else if (v < d.V1) { hint = '조금 더 빠르게'; hintCol = C.dim; }
    else if (v > d.V2) { hint = '너무 세요! 알이 터져요'; hintCol = C.red; }
    else { hint = '좋아요, 이 속도'; hintCol = C.green; }

    if (on.length === 0 || eggs.every(e => e.st !== 'on')) { sac = null; betweenT = 1.1; tone(660, 0.12, 'sine', 0.12); tone(990, 0.18, 'sine', 0.1); }
    if (time >= LIMIT) finish();
  },

  bot(dt) {
    if (st === 'title' || st === 'result') { if (st === 'title') start(); return; }
    if (!sac) { P.down = false; return; }
    if (!sac.held) { P.x = sac.x; P.y = sac.y; P.down = true; G.onDown(P.x, P.y); }
    const a = time * (BOT === 2 ? 7 : 3.0), r = 110;
    P.x = 400 + Math.cos(a) * r; P.y = 420 + Math.sin(a) * r * 0.9;
    if (BOT === 1 && temp < 37.5) pour();
  },

  draw() {
    // 카운터와 큰 그릇
    ctx.fillStyle = '#2A1C14'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = C.wood2; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 14; i++) { ctx.fillStyle = i % 2 ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.03)'; ctx.fillRect(0, i * 60, W, 30); }
    ellipse(400, 430, 335, 320); ctx.fillStyle = '#7F8C93'; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = C.ink; ctx.stroke();
    ellipse(400, 430, 312, 298); const wg = ctx.createRadialGradient(380, 380, 40, 400, 430, 320);
    wg.addColorStop(0, '#CFE7EA'); wg.addColorStop(1, '#8FBFC6'); ctx.fillStyle = wg; ctx.fill();
    // 물결
    ctx.lineWidth = 2;
    for (const r of ripples) { ellipse(r.x, r.y, r.r, r.r * 0.7); ctx.strokeStyle = `rgba(255,255,255,${r.a * 0.6})`; ctx.stroke(); }
    // 그릇 바닥으로 떨어지는 알
    for (const d of drops) {
      const s = 1 - d.t * 0.55; ellipse(d.x, d.y + d.t * 18, 8 * s, 8 * s);
      ctx.fillStyle = d.cloud >= 1 ? `rgba(240,225,205,${1 - d.t * 0.6})` : `rgba(255,120,40,${1 - d.t * 0.6})`; ctx.fill();
    }
    // 망
    rr(MESH.x, MESH.y, MESH.w, MESH.h, 18); ctx.fillStyle = 'rgba(200,210,215,0.18)'; ctx.fill();
    ctx.save(); rr(MESH.x, MESH.y, MESH.w, MESH.h, 18); ctx.clip();
    ctx.strokeStyle = 'rgba(70,85,92,0.55)'; ctx.lineWidth = 2;
    for (let x = MESH.x; x <= MESH.x + MESH.w; x += 18) { ctx.beginPath(); ctx.moveTo(x, MESH.y); ctx.lineTo(x, MESH.y + MESH.h); ctx.stroke(); }
    for (let y = MESH.y; y <= MESH.y + MESH.h; y += 18) { ctx.beginPath(); ctx.moveTo(MESH.x, y); ctx.lineTo(MESH.x + MESH.w, y); ctx.stroke(); }
    ctx.restore();
    rr(MESH.x, MESH.y, MESH.w, MESH.h, 18); ctx.lineWidth = 6; ctx.strokeStyle = '#4F5E66'; ctx.stroke();

    // 알주머니
    if (sac) {
      const on = eggs.filter(e => e.st === 'on');
      ctx.fillStyle = 'rgba(232,150,140,0.55)';
      for (const e of on) { ellipse(sac.x + e.ox, sac.y + e.oy, 16, 16); ctx.fill(); }
      ctx.strokeStyle = 'rgba(190,80,80,0.55)'; ctx.lineWidth = 2;
      for (let i = 0; i < on.length; i += 4) { const e = on[i]; ctx.beginPath(); ctx.moveTo(sac.x, sac.y); ctx.quadraticCurveTo(sac.x + e.ox * 0.4 + 8, sac.y + e.oy * 0.6, sac.x + e.ox, sac.y + e.oy); ctx.stroke(); }
      for (const e of on) drawEgg(sac.x + e.ox + Math.sin(time * 30 + e.wob) * e.stress * 2.5, sac.y + e.oy, 10 + e.stress * 2.5, e.cloud, e.stress);
      if (st === 'play') {
        // 속도 고리
        const d = sac.d, v = sac.v, ringR = d.R + 30;
        const col = !sac.held ? 'rgba(255,255,255,0.35)' : v < d.V1 ? 'rgba(157,180,182,0.9)' : v > d.V2 ? C.red : C.green;
        ctx.lineWidth = 7; ctx.strokeStyle = col; ellipse(sac.x, sac.y, ringR, ringR * 0.9);
        ctx.setLineDash([10, 10]); ctx.lineDashOffset = -time * 40; ctx.stroke(); ctx.setLineDash([]);
      }
    }
    for (const f of fx) { ellipse(f.x, f.y, f.r, f.r); ctx.fillStyle = `rgba(255,130,50,${f.a})`; ctx.fill(); }

    // HUD: 상단
    if (st !== 'title') {
      panel(170, 18, 460, 62, 'rgba(255,243,220,0.95)');
      T(sac ? sac.d.name : (sacI + 1 < SACS.length ? '다음 알주머니…' : '마무리'), 400, 40, 19, C.ink, 'center', 800);
      T(`남은 시간 ${Math.max(0, LIMIT - time).toFixed(0)}초`, 400, 64, 16, '#5B6F78', 'center', 700);
      if (st === 'play' && sac) TS(hint, 400, 118, 26, hintCol);
      drawThermo(); drawSpeed(); drawBowl();
      if (st === 'play') button('pour', '따뜻한 물', 22, 690, 150, 62, '#F2A35E', 20);
    }
    if (st === 'title') titleCard('이쿠라 풀기', '연어 알주머니를 망에 문질러 알을 한 알씩 떼어 내요',
      ['· 알주머니를 잡고 망 위에서 원을 그리며 문질러요',
       '· 고리가 초록이면 딱 좋은 속도, 빨강이면 알이 터져요',
       '· 물이 식으면(36℃ 아래) 막이 안 떨어져요 → 따뜻한 물',
       '· 너무 뜨거우면(44℃ 위) 알이 하얗게 익어요',
       '· 키보드: 스페이스 = 따뜻한 물']);
    if (st === 'result') {
      const pct = got.total ? (got.ok + got.cloud * 0.4) / got.total : 0;
      const stars = pct >= 0.9 ? 3 : pct >= 0.75 ? 2 : pct >= 0.5 ? 1 : 0;
      resultCard(stars >= 3 ? '반짝이는 이쿠라!' : stars >= 2 ? '잘 풀었어요' : stars >= 1 ? '조금 아쉬워요' : '다시 해 봐요', stars, [
        ['온전한 알', `${got.ok} / ${got.total}`], ['하얗게 익은 알', got.cloud], ['터진 알', got.burst],
        ['못 뗀 알', got.total - got.ok - got.cloud - got.burst], ['걸린 시간', time.toFixed(1) + '초']],
        got.burst > got.total * 0.1 ? '문지르는 속도를 고리가 초록일 때로 맞춰 봐요' : got.cloud > 5 ? '물이 너무 뜨거웠어요. 따뜻한 물은 조금씩' : '');
    }
  }
};

function drawEgg(x, y, r, cloud, stress) {
  const c = clamp(cloud, 0, 1);
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, 1, x, y, r);
  g.addColorStop(0, `rgb(255,${200 + c * 40},${120 + c * 110})`);
  g.addColorStop(0.6, `rgb(${250 - stress * 20},${110 + c * 110 - stress * 40},${30 + c * 170})`);
  g.addColorStop(1, `rgb(${200},${70 + c * 130},${20 + c * 160})`);
  ellipse(x, y, r, r); ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(120,40,10,0.6)'; ctx.stroke();
  ellipse(x - r * 0.35, y - r * 0.4, r * 0.28, r * 0.2); ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fill();
}
function drawThermo() {
  const x = 50, y0 = 200, h = 420, t2y = t => y0 + h - (clamp(t, 20, 55) - 20) / 35 * h;
  panel(x - 26, y0 - 40, 52, h + 80, 'rgba(255,243,220,0.95)', C.ink, 26);
  ctx.fillStyle = 'rgba(123,201,111,0.45)'; ctx.fillRect(x - 12, t2y(TEMP.hi), 24, t2y(TEMP.lo) - t2y(TEMP.hi));
  ctx.fillStyle = 'rgba(229,83,61,0.35)'; ctx.fillRect(x - 12, t2y(55), 24, t2y(TEMP.hi) - t2y(55));
  const ty = t2y(temp), col = temp > TEMP.hi ? C.red : temp < TEMP.lo ? '#5A9BD5' : '#E8743B';
  ctx.fillStyle = col; rr(x - 6, ty, 12, y0 + h - ty, 6); ctx.fill();
  ellipse(x, y0 + h + 12, 16, 16); ctx.fill();
  T(temp.toFixed(0) + '℃', x, y0 - 18, 17, C.ink, 'center', 800);
  if (st === 'play') {
    if (temp < TEMP.lo) TS('물이 식었어요', 115, t2y(temp), 17, '#CFE7FF', 'left');
    if (temp > TEMP.hi) TS('너무 뜨거워요!', 115, t2y(temp), 17, '#FFD0C7', 'left');
  }
  if (pourT > 0) { ctx.fillStyle = `rgba(255,190,120,${pourT})`; ellipse(120, 640, 40 * (1 - pourT) + 10, 20); ctx.fill(); }
}
function drawSpeed() {
  if (!sac || st !== 'play') return;
  const d = sac.d, x = 200, y = 735, w = 400, max = d.V2 + 300, v2x = v => x + clamp(v / max, 0, 1) * w;
  panel(x - 14, y - 22, w + 28, 50, 'rgba(255,243,220,0.95)');
  ctx.fillStyle = '#B9C6C9'; ctx.fillRect(x, y - 6, v2x(d.V1) - x, 14);
  ctx.fillStyle = C.green; ctx.fillRect(v2x(d.V1), y - 6, v2x(d.V2) - v2x(d.V1), 14);
  ctx.fillStyle = C.red; ctx.fillRect(v2x(d.V2), y - 6, x + w - v2x(d.V2), 14);
  const nx = v2x(sac.held ? sac.v : 0);
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.moveTo(nx, y - 12); ctx.lineTo(nx - 8, y - 22); ctx.lineTo(nx + 8, y - 22); ctx.fill(); ctx.fillRect(nx - 2, y - 12, 4, 26);
  T('살살', x + 4, y + 20, 12, '#5B6F78', 'left', 700); T('세게', x + w - 4, y + 20, 12, '#5B6F78', 'right', 700);
}
function drawBowl() {
  const x = 700, y = 690;
  ellipse(x, y, 70, 36); ctx.fillStyle = '#2C3E4A'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = C.ink; ctx.stroke();
  ellipse(x, y - 4, 60, 26); ctx.fillStyle = '#233440'; ctx.fill();
  for (let i = 0; i < bowl.length; i++) {
    const a = i * 2.39996, r = Math.sqrt(i) * 3.6, ex = x + Math.cos(a) * Math.min(r, 52), ey = y - 6 + Math.sin(a) * Math.min(r, 52) * 0.42 - Math.floor(r / 52) * 3;
    ellipse(ex, ey, 4, 4); ctx.fillStyle = bowl[i] ? '#F0DCC4' : '#FF7A2E'; ctx.fill();
  }
  T(`${got.ok}알`, x, y + 52, 18, C.cream, 'center', 800);
}
function finish() {
  if (st !== 'play') return;
  st = 'result'; rub.set(0); tone(523, 0.15, 'sine', 0.12); setTimeout(() => tone(784, 0.25, 'sine', 0.12), 120);
  report({ game: 'ikura', ok: got.ok, cloud: got.cloud, burst: got.burst, total: got.total, left: got.total - got.ok - got.cloud - got.burst, time: +time.toFixed(1) });
}
boot();

</script></body></html>
