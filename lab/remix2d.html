function ensureBus(){if(!audio||!gx())return null;if(!bus||bus.ctx!==audio){bus=gx().makeBus(audio,audio.destination);bus.master.gain.value=RemixAudioTable.busGain;wordOut=audio.createGain();wordOut.gain.value=RemixAudioTable.wordGain;wordOut.connect(audio.destination);}return bus;}

function onKey(e){if(!X.active)return;e.stopImmediatePropagation();if(e.ctrlKey||e.metaKey||e.altKey)return;const code=e.code;if(KEYMAP[code]||['Enter','Escape','Tab'].includes(code)||/^Digit[0-9]$/.test(code))e.preventDefault();if(e.repeat)return;try{unlockAudio();}catch{}

$('start').onpointerdown=actions.start;$('again').onpointerdown=actions.again;$('neta').onpointerdown=actions.neta;$('wasabi').onpointerdown=actions.wasabi;$('plate').onpointerdown=e=>{if(e.button===0)actions.plate(e.timeStamp);};

function error(list){$('title').hidden=true;$('tableError').hidden=false;$('tableErrors').textContent=list.map(e=>e.table+' '+e.row+' · '+e.column+' · 규칙 '+e.rule).join('\n');}
