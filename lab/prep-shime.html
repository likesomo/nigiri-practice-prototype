<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>시메 시간표</title>
<style>html,body{margin:0;height:100%;background:#132430;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}canvas{display:block;touch-action:none}
#back{position:fixed;left:10px;top:8px;font:600 13px system-ui,'Malgun Gothic',sans-serif;color:#9DB4B6;text-decoration:none;z-index:2}#out{display:none}</style>
</head><body><a id="back" href="./">← 실험실</a><canvas id="c"></canvas><pre id="out"></pre>
<script>
'use strict';
window.onerror = (m, s, l, c) => { const o = document.getElementById('out'); if (o) o.textContent = 'ERR ' + m + ' @' + l + ':' + c; };
// ── 공통 뼈대: 화면 맞춤 · 입력 · 소리 · 진동 · UI 조각 · 봇/검증 훅 ──
const W = 800, H = 800;
const QS = new URLSearchParams(location.search);
const BOT = +(QS.get('bot') || 0);            // 1 = 잘하는 봇, 2 = 서툰 봇 (검증용)
const FAST = Math.max(1, +(QS.get('fast') || 1));
let seed = +(QS.get('seed') || (Date.now() % 1e9));
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const R = (a, b) => a + (b - a) * rnd();
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const C = { bg: '#132430', bg2: '#1B3442', cream: '#FFF3DC', gold: '#F7B94E', red: '#E5533D', teal: '#3FA7A0', green: '#7BC96F', wood: '#C98B4F', wood2: '#A86F3B', ink: '#0B1820', dim: '#9DB4B6' };

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let DPR = 1, SC = 1;
function fit() {
  DPR = Math.min(2, devicePixelRatio || 1);
  const de = document.documentElement, s = Math.floor(Math.min(innerWidth || de.clientWidth, innerHeight || de.clientHeight)) || 800;
  SC = s / W; cv.style.width = s + 'px'; cv.style.height = s + 'px';
  cv.width = Math.round(s * DPR); cv.height = Math.round(s * DPR);
}
addEventListener('resize', fit); addEventListener('load', fit); fit();
let lastFit = '';
function refit() { const k = innerWidth + 'x' + innerHeight; if (k !== lastFit) { lastFit = k; fit(); } }

// ── 입력 ──
const P = { x: W / 2, y: H / 2, down: false, id: null };
let btns = [];
function toL(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
cv.addEventListener('pointerdown', e => {
  ac(); e.preventDefault();
  const [x, y] = toL(e);
  for (const b of btns) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { G.onButton && G.onButton(b.id); return; }
  if (BOT) return;
  if (P.down) return;               // 두 번째 손가락은 버튼만
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  P.x = x; P.y = y; P.down = true; P.id = e.pointerId;
  G.onDown && G.onDown(x, y);
});
cv.addEventListener('pointermove', e => {
  if (BOT || e.pointerId !== P.id) return;
  const [x, y] = toL(e); P.x = x; P.y = y; G.onMove && G.onMove(x, y);
});
function up(e) { if (BOT || e.pointerId !== P.id) return; P.down = false; P.id = null; G.onUp && G.onUp(); }
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
addEventListener('keydown', e => { ac(); G.onKey && G.onKey(e.code); });

// ── 소리 (WebAudio 합성, 외부 파일 없음) ──
let AC = null, MASTER = null, NB = null;
function ac() {
  if (BOT) return null;
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); MASTER = AC.createGain(); MASTER.gain.value = 0.55; MASTER.connect(AC.destination); } catch (_) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
const live = () => AC && AC.state === 'running';
function tone(f, d = 0.1, type = 'sine', g = 0.2, f2 = 0) {
  if (!live()) return;
  const t = AC.currentTime, o = AC.createOscillator(), v = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(v); v.connect(MASTER); o.start(t); o.stop(t + d + 0.02);
}
function nbuf() { if (!NB) { NB = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } return NB; }
function noise(d = 0.1, g = 0.2, freq = 1200, q = 1, type = 'bandpass') {
  if (!live()) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), v = AC.createGain();
  s.buffer = nbuf(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  v.gain.setValueAtTime(g, t); v.gain.exponentialRampToValueAtTime(0.001, t + d);
  s.connect(f); f.connect(v); v.connect(MASTER); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.02);
}
function loopNoise(freq = 900, q = 0.8) {   // 문지르기처럼 계속 나는 소리
  let s = null, v = null, f = null;
  return {
    set(g, fr) {
      if (!live()) return;
      if (!s) { s = AC.createBufferSource(); s.buffer = nbuf(); s.loop = true; f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; v = AC.createGain(); v.gain.value = 0; s.connect(f); f.connect(v); v.connect(MASTER); s.start(); }
      v.gain.setTargetAtTime(g, AC.currentTime, 0.05);
      if (fr) f.frequency.setTargetAtTime(fr, AC.currentTime, 0.05);
    }
  };
}
let lastBuzz = 0;
function buzz(ms, force) {
  if (BOT) return; const n = performance.now();
  if (!force && n - lastBuzz < 70) return; lastBuzz = n;
  try { navigator.vibrate && navigator.vibrate(ms); } catch (_) {}
}

// ── 그리기 조각 ──
const FONT = 'system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif';
function T(s, x, y, size = 20, col = C.cream, al = 'center', wt = 700, base = 'middle') {
  ctx.font = `${wt} ${size}px ${FONT}`; ctx.fillStyle = col; ctx.textAlign = al; ctx.textBaseline = base; ctx.fillText(s, x, y);
}
function TS(s, x, y, size = 24, col = C.cream, al = 'center', wt = 900) {   // 외곽선 있는 안내 글자
  ctx.font = `${wt} ${size}px ${FONT}`; ctx.textAlign = al; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(11,24,32,0.9)'; ctx.strokeText(s, x, y);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function panel(x, y, w, h, fill = C.cream, stroke = C.ink, r = 16) { rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = stroke; ctx.stroke(); }
function button(id, label, x, y, w, h, col = C.gold, size = 24) {
  btns.push({ id, x, y, w, h });
  rr(x, y + 5, w, h, 14); ctx.fillStyle = C.ink; ctx.fill();
  panel(x, y, w, h, col, C.ink, 14); T(label, x + w / 2, y + h / 2 + 1, size, C.ink, 'center', 800);
}
function star(x, y, r, on) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr_ = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr_, y + Math.sin(a) * rr_); }
  ctx.closePath(); ctx.fillStyle = on ? C.gold : '#3A5563'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = C.ink; ctx.stroke();
}
function ellipse(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, Math.PI * 2); }
// 글 상자 (여러 줄)
function lines(arr, x, y, size = 20, col = C.ink, gap = 1.45, al = 'left', wt = 600) { arr.forEach((s, i) => T(s, x, y + i * size * gap, size, col, al, wt)); }

function titleCard(title, sub, howto, levels) {
  ctx.fillStyle = 'rgba(11,24,32,0.72)'; ctx.fillRect(0, 0, W, H);
  panel(70, 110, 660, 580);
  T(title, W / 2, 175, 40, C.ink, 'center', 900);
  T(sub, W / 2, 222, 19, '#5B6F78', 'center', 600);
  lines(howto, 115, 290, 21, C.ink, 1.6);
  if (levels) levels.forEach((l, i) => button(l.id, l.label, 115 + i * 196, 590, 176, 70, l.col || C.gold, 22));
  else button('start', '시작', W / 2 - 110, 590, 220, 70);
}
function resultCard(title, stars, rows, comment, col = C.ink, opt) {
  ctx.fillStyle = 'rgba(11,24,32,0.72)'; ctx.fillRect(0, 0, W, H);
  panel(90, 100, 620, 600);
  T(title, W / 2, 160, 36, col, 'center', 900);
  for (let i = 0; i < 3; i++) star(W / 2 - 70 + i * 70, 222, 26, i < stars);
  rows.forEach(([k, v], i) => { T(k, 140, 300 + i * 44, 22, '#3A4E57', 'left', 600); T(String(v), 660, 300 + i * 44, 24, C.ink, 'right', 800); });
  if (comment) lines(Array.isArray(comment) ? comment : [comment], W / 2, 300 + rows.length * 44 + 26, 19, '#5B6F78', 1.45, 'center', 600);
  if (opt && opt.next) {
    button('retry', '다시', W / 2 - 280, 600, 170, 66);
    button('next', '다음 스테이지', W / 2 - 95, 600, 220, 66, C.green, 22);
    button('title', '목록', W / 2 + 140, 600, 140, 66, C.cream);
  } else {
    button('retry', '다시 하기', W / 2 - 250, 600, 230, 66);
    button('title', '처음으로', W / 2 + 20, 600, 230, 66, C.cream);
  }
}

// ── 스테이지 · 난이도 ──
const TIERS = ['입문', '보통', '장인'], TIER_COL = [C.green, C.gold, '#F08A5D'];
const SAVE = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} },
};
const Q_STAGE = QS.get('stage') ? +QS.get('stage') - 1 : null, Q_TIER = QS.get('tier') ? +QS.get('tier') - 1 : null;
function bestStars(key, i, t) { const b = SAVE.get(key, {}); return b[i + '_' + t] || 0; }
function saveStars(key, i, t, s) { const b = SAVE.get(key, {}); if ((b[i + '_' + t] || 0) < s) { b[i + '_' + t] = s; SAVE.set(key, b); } }
// 스테이지 목록 화면: 버튼 id = tier0..2, stage0..n
function stageMenu(o) {
  ctx.fillStyle = 'rgba(11,24,32,0.78)'; ctx.fillRect(0, 0, W, H);
  panel(50, 40, 700, 720);
  T(o.title, W / 2, 92, 38, C.ink, 'center', 900);
  T(o.sub, W / 2, 132, 18, '#5B6F78', 'center', 600);
  lines(o.how, 90, 172, 17, '#2F434C', 1.5, 'left', 600);
  const ty = 172 + o.how.length * 25 + 8;
  T('난이도', 90, ty + 26, 18, C.ink, 'left', 800);
  TIERS.forEach((n, i) => {
    const on = i === o.tier;
    button('tier' + i, (on ? '● ' : '') + n, 190 + i * 180, ty, 160, 52, on ? TIER_COL[i] : '#E4DCC8', 20);
  });
  T(o.tierNote[o.tier], W / 2, ty + 78, 15, '#5B6F78', 'center', 600);
  const y0 = ty + 104, gap = Math.min(80, (700 - y0) / o.stages.length);
  o.stages.forEach((s, i) => {
    const y = y0 + i * gap, h = gap - 12;
    btns.push({ id: 'stage' + i, x: 90, y, w: 620, h });
    rr(90, y + 4, 620, h, 14); ctx.fillStyle = C.ink; ctx.fill();
    panel(90, y, 620, h, '#FFFDF6', C.ink, 14);
    T(`${i + 1}`, 122, y + h / 2, 26, C.ink, 'center', 900);
    T(s.name, 150, y + h / 2 - 11, 20, C.ink, 'left', 800);
    T(s.tw, 150, y + h / 2 + 13, 14, '#5B6F78', 'left', 600);
    const b = bestStars(o.key, i, o.tier);
    for (let k = 0; k < 3; k++) star(620 + k * 30, y + h / 2, 11, k < b);
  });
}

// 검증용: 판이 끝나면 결과를 문서 제목과 #out에 남긴다
// ── 사람 모델 (bot=3) ── [가정] 타깃 실력 3단계. 값의 근거는 README '사람 모델' 절
// rt 지각→행동 지연(s) · ctl 힘·속도 조절 흔들림(변동계수) · trace 선 따라가기 흔들림(px, PC 마우스 기준)
// miss 신호 놓침 · imp 참을성(s) · wig 흔들기 요령 사용 비율 · over 물 두 번 붓기 · attn 다른 일 처리 지연 배율
// anticip 예측 행동 · rush 순간적으로 서두르는 빈도
const SKILL = {
  low:  { rt: 0.42, ctl: 0.30, trace: 10, miss: 0.25, imp: 1.6, wig: 0.15, over: 0.40, attn: 1.6, anticip: false, rush: 0.25 },
  mid:  { rt: 0.30, ctl: 0.20, trace: 7,  miss: 0.12, imp: 2.6, wig: 0.50, over: 0.25, attn: 1.0, anticip: false, rush: 0.12 },
  high: { rt: 0.22, ctl: 0.11, trace: 4,  miss: 0.04, imp: 4.0, wig: 0.90, over: 0.08, attn: 0.7, anticip: true,  rush: 0.04 },
};
const HS = { ...SKILL[QS.get('sk') || 'mid'] };
const DEV = QS.get('dev') === 'mobile' ? { trace: 2.5, ctl: 1.25 } : { trace: 1, ctl: 1 };   // 손가락은 마우스보다 크게 흔들린다 [가정]
HS.ctl *= DEV.ctl;
let HB = {};
function gauss() { let u = 0; while (u === 0) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd()); }
function ou(o, dt, tau, sig) { o.v = (o.v || 0) - (o.v || 0) / tau * dt + sig * Math.sqrt(2 * dt / tau) * gauss(); return o.v; }
function Lag() { const b = []; return { push(t, v) { b.push([t, v]); while (b.length > 2 && b[1][0] <= t - 2) b.shift(); }, get(t) { for (let i = b.length - 1; i >= 0; i--) if (b[i][0] <= t) return b[i][1]; return b.length ? b[0][1] : null; } }; }

let DONE = false, LAST = null;
function report(obj) { DONE = true; LAST = obj; const s = JSON.stringify(obj); document.title = 'DONE ' + s; const el = document.getElementById('out'); if (el) el.textContent = s; }

// ── 루프 ──
let last = performance.now(), NOW = 0, FRAMES = 0, PNGF = 0;
function frame(now) {
  const dt = BOT ? 1 / 60 : Math.min(0.05, (now - last) / 1000); last = now;
  for (let i = 0; i < (BOT ? FAST : 1); i++) { NOW += dt; if (BOT && G.bot) G.bot(dt); G.update(dt); }
  refit();
  btns = [];
  ctx.setTransform(DPR * SC, 0, 0, DPR * SC, 0, 0);
  if (!BOT || (FRAMES++ % 30) === 0) G.draw();
  if (!BOT && QS.get('png') && ++PNGF === 3) document.getElementById('out').setAttribute('data-png', cv.toDataURL('image/png'));   // 검증용 화면 추출
  if (BOT) setTimeout(() => frame(performance.now()), 0); else requestAnimationFrame(frame);
}
function boot() {
  if (!BOT) { requestAnimationFrame(frame); return; }
  // 검증 봇: 타이머 없이 한 번에 끝까지 시뮬레이션하고 마지막 화면만 그린다
  const dt = 1 / 60;
  const SHOT = +(QS.get('shot') || 0);   // 스크린샷용: 이 시각에서 멈춤
  const RUNS = +(QS.get('runs') || 1), base = seed, all = [];
  for (let r = 0; r < RUNS; r++) {
    if (r > 0) { seed = base + r * 7919; DONE = false; LAST = null; NOW = 0; HB = {}; G.reset(); }
    let i = 0;
    for (; i < 60 * 900 && !DONE && !(SHOT && NOW >= SHOT); i++) { NOW += dt; G.bot(dt); G.update(dt); }
    if (!DONE && !SHOT) report({ timeout: true, steps: i });
    all.push(LAST);
  }
  if (RUNS > 1) document.getElementById('out').textContent = JSON.stringify(all);
  const fin = () => { fit(); ctx.setTransform(DPR * SC, 0, 0, DPR * SC, 0, 0); G.draw(); };
  fin(); addEventListener('load', fin);
  if (QS.get('png')) { const o = document.getElementById('out'); o.setAttribute('data-png', cv.toDataURL('image/png')); }
}

// ── 시메 시간표 ──
// 등푸른 생선을 소금 → 식초로 절인다. 생선·크기마다 알맞은 시간이 다르고, 소금 쟁반·식초 볼 자리는 한정돼 있다.
// 언제 시작할지 미리 계획하지 않으면 식초 볼이 비지 않아 소금에 너무 오래 둔다. 영업 시간까지 다 내야 한다.
const FISH = {   // [튜닝] 생선 테이블 (분). 실제 절임 시간은 크기·가게마다 다르며 이 값은 게임용
  kohada: { name: '고하다', salt: { S: [15, 22], M: [22, 30], L: [30, 40] }, vin: [15, 25], col: '#9FB3BF', len: 0.8 },
  aji:    { name: '전갱이', salt: { M: [15, 25] }, vin: [8, 14], col: '#B9C3A8', len: 1.0 },
  saba:   { name: '고등어', salt: { L: [60, 90] }, vin: [25, 40], col: '#7FA1B5', len: 1.25 },
  iwashi: { name: '정어리', salt: { S: [10, 15] }, vin: [5, 10], col: '#A9B7D0', len: 0.75 },
};
const SIZE = { S: '작음', M: '보통', L: '큼' };
const STAGES = [   // [튜닝] 스테이지 테이블 — saltCap/vinCap: 자리 수. 영업 시작 = 최적 계획 완료 시각 × 난이도 배율
  { name: '고하다 두 마리', tw: '소금 → 식초 순서 익히기', fish: [['kohada', 'M'], ['kohada', 'M']], saltCap: 2, vinCap: 1 },
  { name: '고하다와 전갱이', tw: '식초 볼은 하나 — 시작을 엇갈리게', fish: [['kohada', 'M'], ['kohada', 'M'], ['aji', 'M']], saltCap: 2, vinCap: 1 },
  { name: '고등어가 들어온 날', tw: '오래 걸리는 생선부터', fish: [['kohada', 'M'], ['aji', 'M'], ['saba', 'L']], saltCap: 2, vinCap: 1 },
  { name: '크기가 다른 고하다', tw: '크기를 보고 시간을 바꾸기', fish: [['kohada', 'S'], ['kohada', 'M'], ['kohada', 'L'], ['kohada', 'L']], saltCap: 2, vinCap: 1 },
  { name: '영업 전 총력', tw: '고등어 두 마리 — 식초 볼을 나눠 쓰기', fish: [['iwashi', 'S'], ['kohada', 'S'], ['aji', 'M'], ['saba', 'L'], ['saba', 'L']], saltCap: 2, vinCap: 1 },
];
const TIER = [   // [튜닝] 난이도 테이블 — mps: 실제 1초당 게임 분, band: 알맞은 구간 표시, num: 분 숫자 표시, endX: 영업 시간 배율
  { mps: 1.5, band: true, num: true, endX: 1.3 },
  { mps: 2.0, band: true, num: false, endX: 1.15 },
  { mps: 2.5, band: false, num: false, endX: 1.05 },
];
const KEY = 'prep-shime';

let st = 'menu', tier = Q_TIER ?? 0, si = 0, S = null, fish = [], clock = 0, speed = 1, end = 0, result = null, fx = [], msgS = '', msgT = 0, plan = null;

function startStage(i, t) {
  si = i; tier = t; S = STAGES[i]; st = 'play'; clock = 0; speed = 1; result = null; fx = [];
  fish = S.fish.map(([k, sz], j) => ({ id: j, k, sz, d: FISH[k], salt: FISH[k].salt[sz], vin: FISH[k].vin, st: 'wait', t0: 0, saltT: null, vinT: null, q: null }));
  plan = null;
  const mk = Math.max(...makePlan(null).map(e => e.at));   // 최적 계획의 마지막 완료 시각
  end = Math.ceil(mk * TIER[tier].endX / 5) * 5;
}
const inState = s => fish.filter(f => f.st === s);
function say(s) { msgS = s; msgT = 1.6; }
function quality(t, [lo, hi]) { if (t >= lo && t <= hi) return 1; const d = t < lo ? lo - t : t - hi; return Math.max(0, 1 - d / (hi - lo)); }
function advance(f) {
  if (st !== 'play') return;
  if (f.st === 'wait') {
    if (inState('salt').length >= S.saltCap) { say('소금 쟁반이 꽉 찼어요'); buzz(30); return; }
    f.st = 'salt'; f.t0 = clock; noise(0.25, 0.2, 5000, 0.8); buzz(10, true);
  } else if (f.st === 'salt') {
    if (inState('vin').length >= S.vinCap) { say('식초 볼이 차 있어요 — 소금이 계속 배요'); buzz(30); tone(220, 0.1, 'square', 0.05); return; }
    f.saltT = clock - f.t0; f.st = 'vin'; f.t0 = clock; noise(0.3, 0.2, 800, 0.6); tone(quality(f.saltT, f.salt) === 1 ? 880 : 440, 0.1, 'sine', 0.08); buzz(10, true);
  } else if (f.st === 'vin') {
    f.vinT = clock - f.t0; f.st = 'done'; f.q = Math.round(50 * quality(f.saltT, f.salt) + 50 * quality(f.vinT, f.vin));
    tone(f.q >= 90 ? 1046 : f.q >= 60 ? 660 : 330, 0.15, 'sine', 0.1); buzz(f.q >= 90 ? 12 : 40, true);
    fx.push({ x: 692, y: 200 + f.id * 20, s: f.q >= 90 ? '완벽!' : f.q >= 60 ? '괜찮아요' : '아쉬워요', a: 1 });
  }
}
function finish() {
  st = 'result';
  const qs = fish.map(f => f.st === 'done' ? f.q : 0), avg = qs.reduce((a, b) => a + b, 0) / qs.length;
  const stars = avg >= 90 ? 3 : avg >= 75 ? 2 : avg >= 55 ? 1 : 0;
  result = { avg, stars, perfect: fish.filter(f => f.q === 100).length, miss: fish.filter(f => f.st !== 'done').length, spare: Math.max(0, end - clock) };
  saveStars(KEY, si, tier, stars);
  report({ game: 'shime', stage: si + 1, tier: tier + 1, avg: Math.round(avg), stars, perfect: result.perfect, miss: result.miss, clock: Math.round(clock) });
}

// ── 계획기 (봇·검증용): 긴 생선부터, 소금·식초 자리 예약표에 맞춰 시작 시각을 정한다 ──
function perms(a) { if (a.length <= 1) return [a]; const o = []; a.forEach((x, i) => perms(a.slice(0, i).concat(a.slice(i + 1))).forEach(p => o.push([x].concat(p)))); return o; }
function makePlan(jitter) {   // 생선 순서를 전부 시험해 가장 빨리 끝나는 계획을 고른다
  let best = null;
  for (const order of perms(fish.slice())) { const p = planFor(order); const mk = Math.max(...p.map(e => e.at)); if (!best || mk < best.mk) best = { mk, p }; }
  return best.p.map(e => ({ ...e, at: e.at + (jitter ? jitter() : 0) }));
}
function planFor(order) {
  const salt = new Array(2000).fill(0), vin = new Array(2000).fill(0);
  const out = [];
  for (const f of order) {
    const sm = Math.round((f.salt[0] + f.salt[1]) / 2), vm = Math.round((f.vin[0] + f.vin[1]) / 2);
    for (let t = 0; t < 1500; t++) {
      let ok = true;
      for (let m = t; m < t + sm && ok; m++) if (salt[m] >= S.saltCap) ok = false;
      for (let m = t + sm; m < t + sm + vm && ok; m++) if (vin[m] >= S.vinCap) ok = false;
      if (!ok) continue;
      for (let m = t; m < t + sm; m++) salt[m]++; for (let m = t + sm; m < t + sm + vm; m++) vin[m]++;
      out.push({ f, at: t, act: 'wait' }, { f, at: t + sm, act: 'salt' }, { f, at: t + sm + vm, act: 'vin' }); break;
    }
  }
  return out.sort((a, b) => a.at - b.at);
}

const G = {
  reset() { st = 'menu'; },
  onButton(id) {
    if (id.startsWith('tier')) tier = +id.slice(4);
    else if (id.startsWith('stage')) startStage(+id.slice(5), tier);
    else if (id === 'retry') startStage(si, tier);
    else if (id === 'next') startStage(Math.min(si + 1, STAGES.length - 1), tier);
    else if (id === 'title') st = 'menu';
    else if (id === 'ff') speed = speed === 1 ? 3 : 1;
    else if (id.startsWith('f')) { const f = fish[+id.slice(1)]; if (f) advance(f); }
  },
  update(dt) {
    for (const f of fx) { f.y -= 30 * dt; f.a -= 0.8 * dt; } fx = fx.filter(f => f.a > 0);
    if (msgT > 0) msgT -= dt;
    if (st !== 'play') return;
    clock += dt * TIER[tier].mps * speed;
    if (fish.every(f => f.st === 'done') || clock >= end) finish();
  },
  bot(dt) {
    if (st === 'menu') { startStage(Q_STAGE ?? 0, Q_TIER ?? 0); return; }
    if (st !== 'play') return;
    if (BOT === 2) {   // 계획 없이: 자리가 나면 바로 넣고, 알맞은 시간 가운데쯤 넘긴다
      for (const f of fish) {
        if (f.st === 'wait') advance(f);
        else if (f.st === 'salt' && clock - f.t0 >= (f.salt[0] + f.salt[1]) / 2) advance(f);
        else if (f.st === 'vin' && clock - f.t0 >= (f.vin[0] + f.vin[1]) / 2) advance(f);
      }
      return;
    }
    if (!plan) {   // bot1: 계획 그대로 · bot3: 사람 반응 지연(실제 초 → 게임 분)과 동시 처리 지연
      const j = BOT === 3 ? () => (HS.rt + R(0, 0.6) * HS.attn) * TIER[tier].mps : null;
      plan = makePlan(j); plan.forEach(e => e.done = false);
    }
    for (const e of plan) if (!e.done && clock >= e.at && e.f.st === e.act) { advance(e.f); if (e.f.st !== e.act) e.done = true; }
  },
  draw() {
    ctx.fillStyle = '#1D2F3A'; ctx.fillRect(0, 0, W, H);
    if (st === 'menu') {
      stageMenu({ title: '시메 시간표', sub: '등푸른 생선을 소금과 식초로 알맞게 절여요', key: KEY, tier, stages: STAGES,
        how: ['· 생선 카드를 누르면 다음 단계로: 대기 → 소금 → 식초 → 완성', '· 생선·크기마다 알맞은 시간이 달라요 (아래 레시피 노트)', '· 자리가 없으면 못 넘겨요. 영업 시작 전에 모두 끝내요'],
        tierNote: ['느린 시계 · 알맞은 구간과 분 숫자가 보여요', '보통 시계 · 구간만 보여요', '빠른 시계 · 구간 없이 살 색과 노트로 판단해요'] });
      return;
    }
    // 상단 시계
    panel(20, 16, 760, 96, 'rgba(255,243,220,0.96)');
    T(`${si + 1}. ${S.name}`, 40, 44, 21, C.ink, 'left', 900);
    T(`${TIERS[tier]} · ${S.tw}`, 40, 74, 14, '#5B6F78', 'left', 700);
    const hh = m => `${String(16 + Math.floor((m + 0) / 60)).padStart(2, '0')}:${String(Math.floor(m % 60)).padStart(2, '0')}`;
    T(hh(clock), 600, 44, 30, C.ink, 'center', 900);
    T(`영업 시작 ${hh(end)}`, 600, 80, 14, end - clock < 20 ? C.red : '#5B6F78', 'center', 800);
    // 진행 막대 (영업까지)
    rr(470, 92, 260, 8, 4); ctx.fillStyle = '#D6DDE0'; ctx.fill(); rr(470, 92, 260 * clamp(clock / end, 0, 1), 8, 4); ctx.fillStyle = end - clock < 20 ? C.red : C.teal; ctx.fill();
    if (st === 'play') button('ff', speed === 1 ? '빨리 ▶▶' : '보통 ▶', 664, 122, 116, 44, speed === 1 ? '#CFE3E8' : C.gold, 17);
    // 네 칸
    const cols = [['wait', '대기 (냉장)', '#2C4655'], ['salt', `소금 쟁반 ${inState('salt').length}/${S.saltCap}`, '#5B6770'], ['vin', `식초 볼 ${inState('vin').length}/${S.vinCap}`, '#6D5A3B'], ['done', '완성', '#2F5D45']];
    cols.forEach(([k, lab, col], ci) => {
      const x = 20 + ci * 192;
      rr(x, 172, 184, 488, 16); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = C.ink; ctx.stroke();
      T(lab, x + 92, 194, 16, C.cream, 'center', 800);
      inState(k).forEach((f, j) => drawCard(f, x + 7, 214 + j * 88));
    });
    for (const f of fx) TS(f.s, f.x, f.y, 18, C.gold);
    // 레시피 노트
    panel(20, 672, 760, 112, '#FFFBEF');
    T('레시피 노트', 40, 694, 15, C.ink, 'left', 900);
    const ks = [...new Set(S.fish.map(([k, sz]) => k + sz))];
    ks.forEach((ksz, i) => { const k = ksz.slice(0, -1), sz = ksz.slice(-1), d = FISH[k]; T(`${d.name}(${SIZE[sz]}) 소금 ${d.salt[sz][0]}~${d.salt[sz][1]}분 · 식초 ${d.vin[0]}~${d.vin[1]}분`, 40 + (i % 2) * 370, 722 + Math.floor(i / 2) * 24, 14, '#2F434C', 'left', 700); });
    if (msgT > 0) TS(msgS, W / 2, 150, 20, C.gold);
    if (st === 'result') {
      const r = result;
      resultCard(r.stars === 3 ? '완벽한 시메!' : r.stars === 2 ? '좋은 절임' : r.stars === 1 ? '조금 아쉬워요' : '영업을 망쳤어요', r.stars, [
        ['평균 품질', Math.round(r.avg) + '점'], ['완벽한 생선', `${r.perfect} / ${fish.length}`], ['영업에 못 낸 생선', r.miss], ['남은 시간', Math.round(r.spare) + '분']],
        r.stars < 3 ? '긴 생선부터 시작하고, 식초 볼이 빌 때를 미리 계산해 봐요' : '', C.ink, { next: si + 1 < STAGES.length });
    }
  }
};
function drawCard(f, x, y) {
  const w = 170, h = 80, tr = TIER[tier];
  btns.push({ id: 'f' + f.id, x, y, w, h });
  panel(x, y, w, h, '#FFF8EA', C.ink, 12);
  // 생선 그림
  const L = 54 * f.d.len * (f.sz === 'S' ? 0.8 : f.sz === 'L' ? 1.2 : 1), fx_ = x + 12, fy = y + 24;
  const whiten = f.st === 'salt' ? clamp((clock - f.t0) / f.salt[1], 0, 1.3) * 0.35 : f.st === 'vin' || f.st === 'done' ? 0.45 + (f.st === 'vin' ? clamp((clock - f.t0) / f.vin[1], 0, 1.3) * 0.4 : 0.4) : 0;
  ctx.save(); ctx.translate(fx_, fy);
  ellipse(L / 2, 0, L / 2, 9); ctx.fillStyle = mix(f.d.col, '#F4F1EA', whiten); ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(L, 0); ctx.lineTo(L + 10, -7); ctx.lineTo(L + 10, 7); ctx.closePath(); ctx.fillStyle = f.d.col; ctx.fill(); ctx.stroke();
  ellipse(7, -2, 2, 2); ctx.fillStyle = C.ink; ctx.fill();
  if (f.st === 'salt') for (let i = 0; i < 9; i++) { ellipse(4 + i * L / 9, -4 + (i % 3) * 3, 1.5, 1.5); ctx.fillStyle = '#fff'; ctx.fill(); }
  ctx.restore();
  T(`${f.d.name} ${SIZE[f.sz]}`, x + w - 8, y + 18, 14, C.ink, 'right', 800);
  if (f.st === 'salt' || f.st === 'vin') {
    const win = f.st === 'salt' ? f.salt : f.vin, el = clock - f.t0, maxT = win[1] * 1.5, bx = x + 10, by = y + 46, bw = w - 20;
    rr(bx, by, bw, 12, 6); ctx.fillStyle = '#DDE3E5'; ctx.fill();
    if (tr.band) { ctx.fillStyle = 'rgba(123,201,111,0.8)'; ctx.fillRect(bx + bw * win[0] / maxT, by, bw * (win[1] - win[0]) / maxT, 12); }
    const over = el > win[1];
    ctx.fillStyle = over ? C.red : f.st === 'salt' ? '#7E8C94' : '#B08A4E'; rr(bx, by + 3, bw * clamp(el / maxT, 0, 1), 6, 3); ctx.fill();
    T(tr.num ? `${Math.floor(el)}분` : (f.st === 'salt' ? '소금' : '식초'), x + 10, y + 70, 13, over ? C.red : '#3A4E57', 'left', 800);
    if (over && tr.band) T('넘었어요!', x + w - 10, y + 70, 13, C.red, 'right', 800);
  } else if (f.st === 'done') T(`품질 ${f.q}`, x + 10, y + 62, 16, f.q >= 90 ? '#2F7D4A' : f.q >= 60 ? '#8A6A1E' : C.red, 'left', 900);
  else T('눌러서 소금에', x + 10, y + 62, 13, '#5B6F78', 'left', 700);
}
function mix(a, b, t) { t = clamp(t, 0, 1); const p = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16)); const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; }
if (Q_STAGE !== null && !BOT) startStage(Q_STAGE, Q_TIER ?? 0);
boot();
