function renderEnvironment(snap){const p=state.piece,env=snap.env;$('envTitle').textContent='';$('envNext').textContent='';$('conditionResult').textContent='';$('envHud').hidden=['title','summary'].includes(state.mode);envHudIcon(env);if(!p)return;const cs=CONFIG.tables.ConditionTable;const keyText=s=>p.wild?.beat===s.beat&&!p.wild.revealed?'?':s.input==='CLICK'?'클릭':s.input==='AD'?'A+D':s.input;const show=s=>hintsVisible()||s.env&&(state.conditionSeen[s.env]||0)<2||p.wild?.beat===s.beat;$('lights').classList.remove('muted');$('lights').innerHTML=p.slots.map(s=>{const c=cs.find(c=>c.id===s.env),active=Math.abs(state.clock-s.due)<.15,auto=p.teachBeats&&!p.teachBeats.includes(s.beat),fx=auto?null:beatFx(s,p);const ring=fx&&fx.ring?'<i class="ring'+(fx.frozen?' guideFreeze':'')+'"'+(fx.frozen?'':' style="transform:translate(-50%,-50%) scale('+fx.ringScale.toFixed(3)+');opacity:'+fx.ringOpacity.toFixed(3)+'"')+'></i>':'';const lampFx=fx?'filter:brightness('+fx.lampBrightness.toFixed(1)+'%);transform:scale('+fx.lampScale.toFixed(3)+');':'';const keyFx=fx&&fx.keyGlow?'transform:scale('+fx.keyScale.toFixed(3)+');text-shadow:0 0 '+(6*fx.keyGlow).toFixed(1)+'px #fff,0 0 '+(12*fx.keyGlow).toFixed(1)+'px #fff;':fx&&fx.stamp?'transform:scale(.85);':'';const keyClass=fx&&fx.frozen?' guideFreeze':'';return '<div class="light '+(active?'active':'')+(auto?' auto':'')+'" data-beat="'+s.beat+'" style="position:relative;'+(c?'border-color:'+NigiriUI.palette(c.cue.lampColor)+';color:'+NigiriUI.palette(c.cue.lampColor)+';':'')+(p.lamps===false&&!c&&p.wild?.beat!==s.beat?'opacity:.18;':'')+lampFx+'">'+ring+s.beat+(show(s)?'<strong class="'+keyClass.trim()+'" style="'+keyFx+'">'+keyText(s)+'</strong>':'')+'</div>';}).join('');const cue=p.slots.find(s=>!s.stamp&&s.due-state.clock<=p.beatSec);if(cue)$('cue').textContent=show(cue)?keyText(cue):'';}
function drawEnvironmentRice(c){const e=state.piece?.env||state.env;if(!e)return;if(e.temperature==='hot'){c.strokeStyle='#f2e6cc99';c.lineWidth=4;for(let i=0;i<3;i++){c.beginPath();c.moveTo(550+i*50,240);c.bezierCurveTo(525+i*50,220,575+i*50,203,550+i*50,180);c.stroke();}}if(e.temperature==='cool'){ellipse(c,600,335,130,34,'#8a837744');}if(e.humidity==='dry')for(let i=0;i<12;i++)ellipse(c,450+i*27,421+i%3*8,8,4,'#f2e6cc');if(e.humidity==='humid')for(let i=0;i<5;i++)ellipse(c,480+i*58,407+i%2*10,10,6,'#f2e6cc99');}
